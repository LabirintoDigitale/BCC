name: Android app

on:
  push:
    branches:
      - "**"
    paths:
      - "app/**"
      - ".github/workflows/android.yml"
    tags:
      - "app-v*"
  pull_request:
    paths:
      - "app/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # Optional: sign with your own key so each new APK installs over the previous one.
      # Secrets: BCC_KEYSTORE_BASE64, BCC_KEYSTORE_PASSWORD, BCC_KEY_ALIAS, BCC_KEY_PASSWORD
      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.BCC_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/bcc.jks"
            echo "BCC_KEYSTORE_PATH=$RUNNER_TEMP/bcc.jks" >> "$GITHUB_ENV"
          else
            echo "No signing key: the APK is signed with a temporary debug key."
          fi

      - name: Build APK
        env:
          BCC_KEYSTORE_PASSWORD: ${{ secrets.BCC_KEYSTORE_PASSWORD }}
          BCC_KEY_ALIAS: ${{ secrets.BCC_KEY_ALIAS }}
          BCC_KEY_PASSWORD: ${{ secrets.BCC_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/BarCodeCards.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: BarCodeCards-apk
          path: ${{ runner.temp }}/BarCodeCards.apk

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/app-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP/BarCodeCards.apk" \
            --title "App Android $GITHUB_REF_NAME" --notes "APK dell'app Android BarCodeCards." --latest=false
